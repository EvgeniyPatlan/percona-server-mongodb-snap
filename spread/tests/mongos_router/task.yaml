summary: MongoDB sharded cluster with mongos router

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  ok=0
  for _ in $(seq 60); do
    percona-server-mongodb.mongosh --quiet --eval 'db.runCommand({ping:1})' && { ok=1; break; }
    sleep 2
  done
  [ "$ok" = 1 ]

execute: |
  echo "Configuring mongod as CSRS"
  MONGOD_CONF="/var/snap/percona-server-mongodb/current/etc/mongod/mongod.conf"
  sed -i \
    -e 's|^#security:|security:|' \
    -e 's|^#  keyFile:|  keyFile:|' \
    -e 's|^#  authorization:|  authorization:|' \
    -e 's|^#replication:|replication:|' \
    -e 's|^#  replSetName:|  replSetName:|' \
    "$MONGOD_CONF"
  grep -q '^  replSetName: rs0' "$MONGOD_CONF"
  grep -q '^  authorization: enabled' "$MONGOD_CONF"
  grep -q '^  keyFile: ' "$MONGOD_CONF"

  TEMP_CONF=$(mktemp)
  awk '/^replication:/{print "sharding:"; print "  clusterRole: configsvr"; print ""} {print}' "$MONGOD_CONF" > "$TEMP_CONF"
  mv "$TEMP_CONF" "$MONGOD_CONF"
  grep -q '^\s*clusterRole: configsvr' "$MONGOD_CONF"

  echo "Restarting mongod"
  snap restart percona-server-mongodb.mongod
  ok=0
  for _ in $(seq 60); do
    percona-server-mongodb.mongosh --quiet --eval 'db.runCommand({ping:1})' && { ok=1; break; }
    sleep 2
  done
  [ "$ok" = 1 ]

  echo "Initiating CSRS replica set"
  percona-server-mongodb.mongosh --quiet --eval 'rs.initiate({_id:"rs0", configsvr:true, members:[{_id:0, host:"127.0.0.1:27017"}]})'

  ok=0
  for _ in $(seq 30); do
    if percona-server-mongodb.mongosh --port 27017 --quiet --eval 'rs.status().myState' 2>/dev/null | grep -qx 1; then
      ok=1
      break
    fi
    sleep 2
  done
  [ "$ok" = 1 ]

  echo "Creating admin user on CSRS"
  percona-server-mongodb.mongosh --quiet --eval 'db.getSiblingDB("admin").createUser({user:"admin",pwd:"adminpassword",roles:[{role:"root",db:"admin"}]})'

  echo "Configuring mongos"
  MONGOS_CONF="/var/snap/percona-server-mongodb/current/etc/mongos/mongos.conf"
  sed -i 's/^#sharding:/sharding:/g' "$MONGOS_CONF"
  sed -i 's/^#  configDB:.*/  configDB: rs0\/127.0.0.1:27017/g' "$MONGOS_CONF"
  echo "security:" >> "$MONGOS_CONF"
  echo "  keyFile: /var/snap/percona-server-mongodb/current/etc/mongodb-keyfile" >> "$MONGOS_CONF"
  grep -q '^sharding:' "$MONGOS_CONF"
  grep -q '^  configDB: rs0/127.0.0.1:27017' "$MONGOS_CONF"
  grep -q '^security:' "$MONGOS_CONF"
  grep -q '^  keyFile: /var/snap/percona-server-mongodb/current/etc/mongodb-keyfile' "$MONGOS_CONF"

  echo "Starting mongos"
  snap start percona-server-mongodb.mongos

  echo "Waiting for mongos to start"
  ok=0
  for _ in $(seq 60); do
    percona-server-mongodb.mongosh --port 27018 --quiet --eval 'db.runCommand({ping:1})' && { ok=1; break; }
    sleep 2
  done
  [ "$ok" = 1 ]

  echo "Verifying sharding status"
  CONFIG_MAP=$(percona-server-mongodb.mongosh --quiet --port 27018 --eval 'db.getSiblingDB("admin").auth("admin","adminpassword"); db.adminCommand({getShardMap:1}).map.config')
  [ "$CONFIG_MAP" != "" ]
  echo "$CONFIG_MAP" | grep -q "rs0/"
  percona-server-mongodb.mongosh --quiet --port 27018 --eval 'db.getSiblingDB("admin").auth("admin","adminpassword"); db.hello().msg' | grep -q isdbgrid

  echo "Mongos router test completed successfully"

restore: |
  snap remove percona-server-mongodb --purge --terminate || true
