summary: Percona Server for MongoDB smoke tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  for _ in $(seq 60); do
    percona-server-mongodb.mongosh --quiet --eval 'db.runCommand({ping:1})' && break
    sleep 2
  done

execute: |
  echo "Percona Server for MongoDB smoke tests"

  echo "Check mongod is running and version"
  percona-server-mongodb.mongosh --quiet --eval 'db.version()' | grep -q '8.0.29'

  echo "CRUD test"
  percona-server-mongodb.mongosh --quiet --eval '
    db.getSiblingDB("smoketest").t1.insertMany([{a:1}, {a:2}])
    db.getSiblingDB("smoketest").t1.countDocuments({}) == 2
  ' | grep -q true

  echo "Test all tools are present"
  for tool in mongosh mongo mongod mongos mongodump mongorestore mongoexport mongoimport mongostat mongotop mongofiles bsondump pbm pbm-agent; do
    echo "Test ${tool}"
    percona-server-mongodb.${tool} --version &>/dev/null || percona-server-mongodb.${tool} -v &>/dev/null || percona-server-mongodb.${tool} version &>/dev/null
  done

  echo "Ensure telemetry is disabled"
  percona-server-mongodb.mongosh --quiet --eval 'db.adminCommand({getParameter:1, perconaTelemetry:1})' | grep -q 'perconaTelemetry.*false'
  test ! -e /snap/percona-server-mongodb/current/usr/bin/percona-telemetry-agent

  echo "Test snap services"
  snap services percona-server-mongodb | grep -q 'mongod.*active'
  snap services percona-server-mongodb | grep 'mongos.*disable' || true
  snap services percona-server-mongodb | grep 'pbm-agent.*disable' || true

  echo "Check snap logs for fatal errors"
  if snap logs percona-server-mongodb -n 100 | grep -i fatal; then
    echo "Found fatal errors in logs"
    exit 1
  fi

restore: |
  snap remove percona-server-mongodb --purge --terminate || true
