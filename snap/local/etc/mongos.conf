# Seeded to /var/snap/_NAME_/current/etc/mongos/mongos.conf on install.
# mongos is disabled by default: configure sharding.configDB below, then
#   sudo snap start _NAME_.mongos
systemLog:
  destination: file
  path: /var/snap/_NAME_/common/var/log/mongos/mongos.log
  logAppend: true
  logRotate: reopen
net:
  bindIp: 127.0.0.1
  port: 27018
processManagement:
  fork: false
#sharding:
#  configDB: csrs/127.0.0.1:27017
