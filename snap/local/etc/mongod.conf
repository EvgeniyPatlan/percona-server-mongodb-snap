# Seeded to /var/snap/_NAME_/current/etc/mongod/mongod.conf on install.
# Edit there and: sudo snap restart _NAME_.mongod
# Extra ad-hoc flags: sudo snap set _NAME_ mongod-args="--quiet"
storage:
  dbPath: /var/snap/_NAME_/common/var/lib/mongodb
systemLog:
  destination: file
  path: /var/snap/_NAME_/common/var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen
net:
  bindIp: 127.0.0.1
  port: 27017
processManagement:
  fork: false
  pidFilePath: /var/snap/_NAME_/common/run/mongod.pid
setParameter:
  perconaTelemetry: false
# --- Replica set: uncomment both sections, run _NAME_.set-keyfile first,
# --- then: sudo snap restart _NAME_.mongod && _NAME_.mongosh --eval 'rs.initiate()'
#security:
#  keyFile: /var/snap/_NAME_/current/etc/mongodb-keyfile
#  authorization: enabled
#replication:
#  replSetName: rs0
